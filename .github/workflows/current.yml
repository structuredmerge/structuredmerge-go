name: Current

permissions:
  contents: read

on:
  push:
    branches:
      - "main"
      - "*-stable"
    tags:
      - "!*" # Do not execute on tags
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Checkout language-pack fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: pboling/tree-sitter-language-pack
          path: tree-sitter-language-pack
      - name: Link sibling language-pack path
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/tree-sitter-language-pack" ../tree-sitter-language-pack
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Run checks
        run: mise run check
