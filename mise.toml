[tools]
go = "latest"

[env]
GOFLAGS = "-tags=tspack"

[tasks.format]
run = "gofmt -w $(find . -name '*.go' -type f)"

[tasks.format-check]
run = "test -z \"$(gofmt -l $(find . -name '*.go' -type f))\""

[tasks.lint]
run = "go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run ./..."

[tasks.typecheck]
run = "go test ./... -run '^$'"

[tasks.test]
run = "go test ./..."

[tasks.check]
run = "test -z \"$(gofmt -l $(find . -name '*.go' -type f))\" && go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run ./... && go test ./..."

[tasks.release]
raw = true
description = "Publish the Go module; pass release options after --"
run = "ruby workspace-scripts/release_go_module.rb"
